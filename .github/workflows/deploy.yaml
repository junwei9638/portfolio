name: CI/CD for Static Website

on:
  push:
    branches:
      - main  # 只有推 main 時觸發
  pull_request:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ 取得程式碼
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ 安裝 Node.js（做 lint / build 用）
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    # 3️⃣ 安裝 lint 工具
    - name: Install linters
      run: |
        npm install --save-dev eslint htmlhint stylelint

    # 4️⃣ JS lint
    - name: Run ESLint
      run: npx eslint "**/*.js" || echo "⚠️ ESLint warnings/errors found"

    # 5️⃣ HTML lint
    - name: Run HTMLHint
      run: npx htmlhint "**/*.html" || echo "⚠️ HTMLHint warnings/errors found"

    # 6️⃣ CSS lint (可選)
    - name: Run Stylelint
      run: npx stylelint "**/*.css" || echo "⚠️ Stylelint warnings/errors found"

    # 7️⃣ 同步到 AWS S3
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-3

    - name: Sync files to S3
      run: |
        aws s3 sync . s3://junwei-portfolio-web-bucket --delete --exclude ".git/*" --exclude ".github/*"

    # 8️⃣ 清除 CloudFront 快取
    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
